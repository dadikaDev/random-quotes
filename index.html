<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Random Quotes</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
            integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <link rel="stylesheet" href="style.css" />
        <link rel="icon" href="assets/favicon/favicon.ico">
    </head>

    <body>
        <div class="layout">
            <div class="left-panel">
                <h1 class="title">Random Quotes</h1>
                <div id="quote" class="quote-card fade-in">
                    <p id="quote-text" class="quote-text">
                        Get a random quote:
                    </p>
                    <div id="spinner" style="display: none"></div>
                    <p id="quote-author" class="quote-author"></p>
                </div>
                <div class="favorite-icon-wrapper">
                    <i
                        id="quote-favorite-btn"
                        class="far fa-star favorite-icon"
                    ></i>
                </div>
                <div class="buttons">
                    <button id="random-quote-btn" class="btn btn-primary">
                        Local Quote <i class="fa fa-home icon-space"></i>
                    </button>
                    <button id="random-quote-api-btn" class="btn btn-secondary">
                        API Quote <i class="fa fa-globe icon-space"></i>
                    </button>
                </div>
            </div>
            <div id="favorites-container" class="favorites-container"></div>
        </div>
        <script src="index.js" type="module"></script>
    </body>
</html>
